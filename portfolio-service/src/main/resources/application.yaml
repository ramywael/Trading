spring:
  application:
    name: portfolio-service

  datasource:
    url: jdbc:postgresql://localhost:5432/portfolio_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      # ponytail: update is fine for dev; switch to validate + Flyway before prod
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # This service only consumes (order events -> update holdings)
    consumer:
      group-id: portfolio-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        # Producers send plain Maps: ignore their type header and read every event as a Map
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000

server:
  port: 8084

# Base URL for MarketDataClient (Feign)
market:
  service:
    url: ${MARKET_SERVICE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: User holdings and live portfolio value
    version: 0.0.1-SNAPSHOT
